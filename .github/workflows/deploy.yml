# Deploy sedel.ch auf Green per FTP(S)
#
# Lädt bei jedem Push auf main nur geänderte Dateien nach /httpdocs hoch.
# Der Abgleich läuft über .ftp-deploy-sync-state.json auf dem Server;
# beim allerersten Lauf fehlt diese Datei, dann wird einmal alles hochgeladen.
#
# Benötigte Secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER    web3.servicehoster.ch
#   FTP_USERNAME  h203408_user
#   FTP_PASSWORD  (FTP-Passwort)

name: Deploy to Green

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur anzeigen, was hochgeladen würde (nichts ändern)"
        type: boolean
        default: true

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Secrets prüfen
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          missing=0
          for v in FTP_SERVER FTP_USERNAME FTP_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Repository-Secret $v fehlt (Settings → Secrets and variables → Actions → Repository secrets)"; missing=1; fi
          done
          exit $missing

      - name: Checkout
        uses: actions/checkout@v5

      - name: FTP-Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          server-dir: /httpdocs/
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            .ddev/**
            .vscode/**
            **/node_modules/**
            **/.DS_Store
            sites/*/settings.php
            sites/*/settings.local.php
            sites/*/settings.ddev.php
            sites/*/files/**
            sites/*/private/**
            *.sql
            *.sql.gz
